services:
  - type: web
    name: csv-statistics-voila
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python build_notebook.py
    startCommand: >-
      voila app.ipynb --no-browser --Voila.ip=0.0.0.0 --port=$PORT --VoilaConfiguration.theme=light --MappingKernelManager.cull_idle_timeout=60 --MappingKernelManager.cull_interval=30
    healthCheckPath: /
    autoDeploy: true